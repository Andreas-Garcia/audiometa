# Maintainer-controlled: Lint and test on pull requests
# Contributors can suggest changes via PRs, but maintainers review and approve all CI/CD changes.
name: Lint and Test

on:
  pull_request:
    branches: [main]

concurrency:
  group: lint-and-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Use primary Ubuntu APT mirrors (CI)
        run: |
          echo 'deb http://archive.ubuntu.com/ubuntu noble main universe' | sudo tee /etc/apt/sources.list
          echo 'deb http://archive.ubuntu.com/ubuntu noble-updates main universe' | sudo tee -a /etc/apt/sources.list
          echo 'deb http://security.ubuntu.com/ubuntu noble-security main universe' | sudo tee -a /etc/apt/sources.list
          sudo apt-get update -qq

      - name: Install lint system dependencies
        run: bash scripts/install-system-dependencies-ubuntu.sh lint

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pre-commit hooks
        env:
          SKIP_SYSTEM_DEPENDENCY_VERIFICATION: "true"
        run: pre-commit run --all-files --verbose --show-diff-on-failure

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Use primary Ubuntu APT mirrors (CI)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          echo 'deb http://archive.ubuntu.com/ubuntu noble main universe' | sudo tee /etc/apt/sources.list
          echo 'deb http://archive.ubuntu.com/ubuntu noble-updates main universe' | sudo tee -a /etc/apt/sources.list
          echo 'deb http://security.ubuntu.com/ubuntu noble-security main universe' | sudo tee -a /etc/apt/sources.list
          sudo apt-get update -qq

      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-24.04'
        run: bash scripts/install-system-dependencies-ubuntu.sh

      - name: Install system dependencies (macOS)
        if: matrix.os == 'macos-14'
        run: bash scripts/install-system-dependencies-macos.sh

      - name: Install system dependencies (Windows)
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: .\scripts\install-system-dependencies-windows.ps1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Cache pytest cache
        uses: actions/cache@v4
        with:
          path: .pytest_cache
          key: pytest-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pytest-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Run unit tests
        if: matrix.os != 'windows-2022'
        run: pytest -m unit --cov=audiometa --cov-report=xml --cov-report=term

      - name: Run integration tests
        if: matrix.os != 'windows-2022'
        run: pytest -m integration --cov=audiometa --cov-report=xml --cov-report=term --cov-append

      - name: Run e2e tests
        run: pytest -m e2e --cov=audiometa --cov-report=xml --cov-report=term --cov-append

      - name: Check combined coverage threshold
        if: matrix.os != 'windows-2022'
        run: coverage report --fail-under=85

  lint-and-tests-success:
    name: Lint and tests success
    runs-on: ubuntu-24.04
    needs: [lint, test]
    steps:
      - run: echo "All checks passed"
