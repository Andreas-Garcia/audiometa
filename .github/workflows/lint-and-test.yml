# Maintainer-controlled: Lint and test on pull requests
# Contributors can suggest changes via PRs, but maintainers review and approve all CI/CD changes.
name: Lint and Test

on:
  pull_request:
    branches: [main]

concurrency:
  group: lint-and-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    uses: BehindTheMusicTree/python-project-standards/.github/workflows/reusable-pre-commit.yml@v2.2.0
    with:
      runs-on: ubuntu-24.04
      python-version: "3.13"
      pre-install-command: |
        echo 'deb http://archive.ubuntu.com/ubuntu noble main universe' | sudo tee /etc/apt/sources.list
        echo 'deb http://archive.ubuntu.com/ubuntu noble-updates main universe' | sudo tee -a /etc/apt/sources.list
        echo 'deb http://security.ubuntu.com/ubuntu noble-security main universe' | sudo tee -a /etc/apt/sources.list
        sudo apt-get update -qq
        bash scripts/install-system-dependencies-ubuntu.sh lint
      install-command: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
      pre-commit-command: SKIP_SYSTEM_DEPENDENCY_VERIFICATION=true pre-commit run --all-files --verbose --show-diff-on-failure

  test:
    name: Test
    uses: BehindTheMusicTree/python-project-standards/.github/workflows/reusable-test-matrix.yml@v2.2.0
    with:
      os-matrix: '["ubuntu-24.04","macos-14","windows-2022"]'
      python-matrix: '["3.12","3.13","3.14"]'
      pre-install-ubuntu: |
        echo 'deb http://archive.ubuntu.com/ubuntu noble main universe' | sudo tee /etc/apt/sources.list
        echo 'deb http://archive.ubuntu.com/ubuntu noble-updates main universe' | sudo tee -a /etc/apt/sources.list
        echo 'deb http://security.ubuntu.com/ubuntu noble-security main universe' | sudo tee -a /etc/apt/sources.list
        sudo apt-get update -qq
        bash scripts/install-system-dependencies-ubuntu.sh
      pre-install-macos: bash scripts/install-system-dependencies-macos.sh
      pre-install-windows: .\scripts\install-system-dependencies-windows.ps1
      install-command: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
      unit-command: pytest -m unit --cov=audiometa --cov-report=xml --cov-report=term
      integration-command: pytest -m integration --cov=audiometa --cov-report=xml --cov-report=term --cov-append
      e2e-command: pytest -m e2e --cov=audiometa --cov-report=xml --cov-report=term --cov-append
      coverage-fail-under: "85"
      cache-pytest: true

  lint-and-tests-success:
    name: Lint and tests success
    runs-on: ubuntu-24.04
    needs: [lint, test]
    steps:
      - run: echo "All checks passed"
