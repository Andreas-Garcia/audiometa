# For a full release (CHANGELOG + version + commit + tag), use scripts/prepare_release.py;
# it updates CHANGELOG with the new version and today's date, then runs bump2version. Running
# bump2version alone only bumps version in pyproject.toml and does not update CHANGELOG.
[bumpversion]
current_version = 1.3.1
commit = True
tag = True
tag_name = v{new_version}
message = chore: prepare release {new_version}

[bumpversion:file:pyproject.toml]
